name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Fully pinned, so the released exe is built from known dependency versions.
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest
      - run: python -m PyInstaller build.spec --noconfirm
      # sha256sum-compatible, so users can verify a download with `sha256sum -c`
      # or Get-FileHash.
      - name: Checksum
        run: |
          $hash = (Get-FileHash dist/AsusFanControlUI.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/AsusFanControlUI.exe.sha256 -Value "$hash *AsusFanControlUI.exe" -Encoding ascii
      # Ship the notices file with the exe: it credits upstream and documents the ASUS DLL the app loads at runtime.
      - run: gh release create "${{ github.ref_name }}" dist/AsusFanControlUI.exe dist/AsusFanControlUI.exe.sha256 THIRD_PARTY_NOTICES.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
