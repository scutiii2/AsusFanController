name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m PyInstaller build.spec --noconfirm
      # The notices file must ship with the exe: MIT requires the upstream notice in every copy.
      - run: gh release create "${{ github.ref_name }}" dist/AsusFanControlUI.exe THIRD_PARTY_NOTICES.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
